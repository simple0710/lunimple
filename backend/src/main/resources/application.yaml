spring:

  application:
    name: lunimple
  mvc:
    servlet:
      path: /api/v1
  h2:
    console:
      enabled: true
  datasource:
    url: jdbc:mysql://localhost:3306/lunimple?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    show-sql: true
    hibernate:
      ddl-auto: create